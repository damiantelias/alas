version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: alas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alas_user
      POSTGRES_PASSWORD: alas_pass
      POSTGRES_DB: alas_db
    ports:
      - "5432:5432"
    volumes:
      - alas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alas_user -d alas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - alas_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  alas_postgres_data:
  alas_redis_data:
